services:

  mysql:
    image: mysql:8.0
    container_name: jobscope-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+09:00
      - --init-connect=SET NAMES utf8mb4
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - db-net

  backend:
    image: 2000jch/jobscope-backend:latest
    build:
      context: ./jobscope-backend
      dockerfile: Dockerfile
    container_name: jobscope-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRE: ${JWT_ACCESS_EXPIRE}
      JWT_REFRESH_EXPIRE: ${JWT_REFRESH_EXPIRE}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-validate}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SPRING_PROFILES_ACTIVE: prod
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-jobscope1}
      AWS_S3_REGION: ${AWS_S3_REGION:-ap-northeast-2}
    expose:
      - "8080"
    networks:
      - db-net
      - backend-net

  frontend:
    image: 2000jch/jobscope-frontend:latest
    build:
      context: ./jobscope-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/}
        VITE_KAKAO_CLIENT_ID: ${VITE_KAKAO_CLIENT_ID}
        VITE_KAKAO_REDIRECT_URI: ${VITE_KAKAO_REDIRECT_URI:-http://localhost/login}
    container_name: jobscope-frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - frontend-net

  nginx:
    image: 2000jch/jobscope-nginx:latest
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: jobscope-nginx
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot
    networks:
      - backend-net
      - frontend-net

volumes:
  mysql_data:

networks:
  db-net:
  backend-net:
  frontend-net: